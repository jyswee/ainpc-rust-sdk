[package]
name = "ainpc-sdk"
version = "0.2.0"
edition = "2021"
description = "AINPCEngine SDK - AI-powered NPCs with persistent memory for Rust game engines"
license-file = "LICENSE"
authors = ["jyswee <jyswee@gmail.com>"]
repository = "https://github.com/jyswee/ainpc-rust-sdk"
homepage = "https://ainpcengine.com"
keywords = ["npc", "ai", "gamedev", "rpg", "dialogue"]
categories = ["game-development", "api-bindings"]

[features]
default = ["native"]
native = ["tokio-tungstenite", "futures-util", "tokio"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"], optional = true }
tokio-tungstenite = { version = "0.24", features = ["native-tls"], optional = true }
futures-util = { version = "0.3", optional = true }
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
